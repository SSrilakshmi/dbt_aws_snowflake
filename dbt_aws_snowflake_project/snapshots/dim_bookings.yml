snapshots:
  - name: dim_bookings
    description: "A snapshot of the bookings data from the bookings table"
    relation: ref('eph_bookings')
    config:
      schema: gold
      database: db_airbnb
      unique_key: booking_id
      strategy: timestamp
      updated_at: booking_created_at
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.